<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrishtiDev</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DrishtiDev</h1>
        </header>
        
        <main>
            <section class="inspector-section">
                <h2>Element Inspector</h2>
                <div id="inspector-content">
                    <!-- Inspector content will be dynamically populated -->
                </div>
            </section>

            <section class="responsive-section">
                <h2>Responsive Preview</h2>
                <div id="responsive-content">
                    <!-- Responsive preview content will be dynamically populated -->
                </div>
            </section>

            <section class="network-section">
                <h2>Network Monitor</h2>
                <div id="network-content">
                    <!-- Network monitoring content will be dynamically populated -->
                </div>
            </section>
        </main>
    </div>
    <script src="popup.js"></script>
</body>
</html>
